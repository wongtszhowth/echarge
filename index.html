<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Charge Whampoa</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Title styled as an interactive button */
        .refresh-title {
            color: #2c3e50;
            margin-bottom: 20px;
            cursor: pointer;
            transition: transform 0.1s ease, color 0.2s ease;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .refresh-title:hover {
            color: #05451b;
            transform: scale(1.02);
        }

        .refresh-title:active {
            transform: scale(0.98);
        }

        .table-container {
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background-color: #05451b;
            color: white;
            font-weight: 600;
        }

        /* Center-align all columns starting from the Elapsed column */
        th:nth-child(n+2), 
        td:nth-child(n+2) {
            text-align: center;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        .loading {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
            padding: 20px;
        }

        .error {
            color: #c0392b;
            font-weight: bold;
            text-align: center;
            padding: 20px;
        }

        /* Subtle indicator pill styling for charging events */
        .charging-badge {
            background-color: #e8f8f5;
            color: #117a65;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9em;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h1 class="refresh-title" id="refresh-btn" title="Click to refresh data">
        E-Charge WP 🔋
    </h1>

    <div class="table-container">
        <table id="data-table">
            <thead>
                <tr>
                    <th>Date & Time</th>
                    <th>🔌</th>
                    <th>🈳</th>
                    <th>⚡</th>
                    <th>🛑</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr>
                    <td colspan="5" class="loading">Fetching latest data...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const csvUrl = 'echarge_whampoa_log.csv'; 

        // Fix corrupted text glyph headers and adjust layout positions
        const CLEAN_HEADERS = ["Date & Time", "Elapsed", "⚡ In Use", "🔋 Avail", "🅿️ Empty"];

        function parseCustomDate(dateStr) {
            // Adjust this if your CSV timestamp format varies drastically (e.g., YYYY-MM-DD HH:mm:ss)
            return new Date(dateStr.replace(/-/g, '/'));
        }

        function calculateElapsed(rowDateStr) {
            const rowTime = parseCustomDate(dateStr);
            const now = new Date();
            const diffMs = now - rowTime;

            if (isNaN(diffMs) || diffMs < 0) return "";

            const totalMinutes = Math.floor(diffMs / 60000);
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;

            return `${hours}h${minutes.toString().padStart(2, '0')}m`;
        }

        async function fetchCSVData() {
            const tableBody = document.getElementById('table-body');
            
            try {
                const response = await fetch(`${csvUrl}?t=${new Date().getTime()}`); // Cache buster
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.text();
                
                const rows = data.split('\n')
                    .map(row => row.trim())
                    .filter(row => row.length > 0); 

                const dataRows = rows.slice(1); 

                // Get the last 17 rows so we can compare the 16th row with its predecessor
                const sampleCount = Math.min(dataRows.length, 17);
                const targetedSlice = dataRows.slice(-sampleCount);

                tableBody.innerHTML = '';

                // Iterate through the slice backwards (from newest entries down to oldest entries)
                for (let i = targetedSlice.length - 1; i >= 0; i--) {
                    // Stop processing if we drop below our targeted viewport threshold
                    if (targetedSlice.length - i > 16) break;

                    const currentColumns = targetedSlice[i].split(',');
                    
                    // Edge case: line formatting validation check
                    if (currentColumns.length < 4) continue;

                    // Extracted core parameters: [0]=Timestamp, [1]=In-Use (⚡)
                    const dateStr = currentColumns[0].trim();
                    const currentInUse = parseInt(currentColumns[1].trim(), 10) || 0;

                    let elapsedDisplay = "";

                    // Peak downstream check: Is there an older row available to calculate increment constraints?
                    if (i > 0) {
                        const previousColumns = targetedSlice[i - 1].split(',');
                        const previousInUse = parseInt(previousColumns[1].trim(), 10) || 0;

                        // Check condition: Charging event detected via metrics incrementation step
                        if (currentInUse > previousInUse) {
                            const rowTime = parseCustomDate(dateStr);
                            const now = new Date();
                            const diffMs = now - rowTime;

                            if (!isNaN(diffMs) && diffMs >= 0) {
                                const totalMinutes = Math.floor(diffMs / 60000);
                                const hours = Math.floor(totalMinutes / 60);
                                const minutes = totalMinutes % 60;
                                elapsedDisplay = `<span class="charging-badge">${hours}h${minutes.toString().padStart(2, '0')}m</span>`;
                            }
                        }
                    }

                    const tr = document.createElement('tr');
                    
                    // 1. Column: Date & Time
                    const tdTime = document.createElement('td');
                    tdTime.textContent = dateStr;
                    tr.appendChild(tdTime);

                    // 2. Column: New Elapsed Column insertion point
                    const tdElapsed = document.createElement('td');
                    tdElapsed.innerHTML = elapsedDisplay;
                    tr.appendChild(tdElapsed);

                    // 3. Columns: Dynamic structural array tracking loop for metrics parameters 2, 3, and 4
                    for (let j = 1; j <= 3; j++) {
                        const td = document.createElement('td');
                        td.textContent = currentColumns[j] ? currentColumns[j].trim() : "";
                        tr.appendChild(td);
                    }
                    
                    tableBody.appendChild(tr);
                }

            } catch (error) {
                console.error('Error fetching CSV:', error);
                tableBody.innerHTML = `<tr><td colspan="5" class="error">Failed to load data. Ensure CORS is enabled on the CSV host.</td></tr>`;
            }
        }

        // Attach layout actions
        document.getElementById('refresh-btn').addEventListener('click', () => {
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = '<tr><td colspan="5" class="loading">Refreshing latest data...</td></tr>';
            fetchCSVData();
        });

        fetchCSVData();
        setInterval(fetchCSVData, 30000);
    </script>
</body>
</html>
