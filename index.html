<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Charge Whampoa</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Title styled as an interactive button */
        .refresh-title {
            color: #2c3e50;
            margin-bottom: 5px;
            cursor: pointer;
            transition: transform 0.1s ease, color 0.2s ease;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .refresh-title:hover {
            color: #05451b;
            transform: scale(1.02);
        }

        .refresh-title:active {
            transform: scale(0.98);
        }

        /* Last updated timestamp line styling */
        .update-status {
            font-size: 0.95em;
            color: #555;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .table-container {
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background-color: #05451b;
            color: white;
            font-weight: 600;
        }

        /* Center-align all columns starting from the Elapsed column (Columns 2-5) */
        th:nth-child(n+2), 
        td:nth-child(n+2) {
            text-align: center;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        .loading {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
            padding: 20px;
        }

        .error {
            color: #c0392b;
            font-weight: bold;
            text-align: center;
            padding: 20px;
        }

        /* Indicator pill styling for charging events */
        .charging-badge {
            background-color: #e8f8f5;
            color: #117a65;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9em;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h1 class="refresh-title" id="refresh-btn" title="Click to refresh data">
        E-Charge WP 🔋
    </h1>

    <div class="update-status" id="update-timestamp">Last updated: Fetching...</div>

    <div class="table-container">
        <table id="data-table">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>🔌</th>
                    <th>🈳</th>
                    <th>⚡</th>
                    <th>🛑</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr>
                    <td colspan="5" class="loading">Fetching latest data...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const csvUrl = 'echarge_whampoa_log.csv'; 

        function calculateSimpleElapsed(fullDateStr) {
            try {
                // Extract the time part (HH:MM:SS) from "MM-DD HH:MM:SS"
                const parts = fullDateStr.trim().split(' ');
                if (parts.length < 2) return "";
                
                const timeParts = parts[1].split(':');
                if (timeParts.length < 2) return "";

                const rowHours = parseInt(timeParts[0], 10);
                const rowMinutes = parseInt(timeParts[1], 10);
                const rowTotalMinutes = (rowHours * 60) + rowMinutes;

                // Get current local system hours and minutes
                const now = new Date();
                const currentHours = now.getHours();
                const currentMinutes = now.getMinutes();
                const currentTotalMinutes = (currentHours * 60) + currentMinutes;

                // Calculate the difference in minutes
                let diffMinutes = currentTotalMinutes - rowTotalMinutes;

                // Handle midnight crossover boundaries elegantly
                if (diffMinutes < 0) {
                    diffMinutes += 24 * 60; 
                }

                const displayHours = Math.floor(diffMinutes / 60);
                const displayMinutes = diffMinutes % 60;

                return `<span class="charging-badge">${displayHours}h${displayMinutes.toString().padStart(2, '0')}m</span>`;
            } catch (e) {
                console.error("Error calculating simplified elapsed time:", e);
                return "";
            }
        }

        async function fetchCSVData() {
            const tableBody = document.getElementById('table-body');
            const updateStatus = document.getElementById('update-timestamp');
            
            try {
                const response = await fetch(`${csvUrl}?t=${new Date().getTime()}`); 
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.text();
                
                const rows = data.split('\n')
                    .map(row => row.trim())
                    .filter(row => row.length > 0); 

                const dataRows = rows.slice(1); 
                if (dataRows.length === 0) return;

                // Update the "Last updated" string using the full timestamp from the newest row (the last item)
                const newestRawRow = dataRows[dataRows.length - 1].split(',');
                if (newestRawRow.length >= 1) {
                    updateStatus.textContent = `Last updated: ${newestRawRow[0].trim()}`;
                }

                // Pull up to 18 rows so we can compare differences for a clean 16-row window view
                const sampleCount = Math.min(dataRows.length, 18);
                const targetedSlice = dataRows.slice(-sampleCount);

                tableBody.innerHTML = '';

                // Iterate backwards to list the newest events at the very top
                for (let i = targetedSlice.length - 1; i >= 0; i--) {
                    if (targetedSlice.length - i > 16) break;

                    const currentColumns = targetedSlice[i].split(',');
                    if (currentColumns.length < 4) continue; 

                    const fullDateStr = currentColumns[0].trim();
                    
                    // Isolate just the "HH:MM:SS" portion for table rendering display
                    let displayTimeOnly = fullDateStr;
                    const timePartsSplit = fullDateStr.split(' ');
                    if (timePartsSplit.length >= 2) {
                        displayTimeOnly = timePartsSplit[1]; 
                    }

                    let elapsedDisplay = "";

                    // Look down to the line logged prior to check for metric changes
                    if (i > 0) {
                        const previousColumns = targetedSlice[i - 1].split(',');
                        if (previousColumns.length >= 4) {
                            const currentInUse = parseInt(currentColumns[2].trim(), 10) || 0;
                            const previousInUse = parseInt(previousColumns[2].trim(), 10) || 0;

                            if (currentInUse > previousInUse) {
                                elapsedDisplay = calculateSimpleElapsed(fullDateStr);
                            }
                        }
                    }

                    const tr = document.createElement('tr');
                    
                    // 1. Column: Simplified Time Only (HH:MM:SS)
                    const tdTime = document.createElement('td');
                    tdTime.textContent = displayTimeOnly;
                    tr.appendChild(tdTime);

                    // 2. Column: Elapsed Time Duration
                    const tdElapsed = document.createElement('td');
                    tdElapsed.innerHTML = elapsedDisplay;
                    tr.appendChild(tdElapsed);

                    // 3, 4, 5. Columns: Available, In Use, Stopped
                    for (let j = 1; j <= 3; j++) {
                        const td = document.createElement('td');
                        td.textContent = currentColumns[j] ? currentColumns[j].trim() : "";
                        tr.appendChild(td);
                    }
                    
                    tableBody.appendChild(tr);
                }

            } catch (error) {
                console.error('Error fetching CSV:', error);
                tableBody.innerHTML = `<tr><td colspan="5" class="error">Failed to load data. Ensure CORS is enabled on the CSV host.</td></tr>`;
                updateStatus.textContent = "Last updated: Error checking file";
            }
        }

        // Setup manual refresh trigger event actions on title click
        document.getElementById('refresh-btn').addEventListener('click', () => {
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = '<tr><td colspan="5" class="loading">Refreshing latest data...</td></tr>';
            fetchCSVData();
        });

        fetchCSVData();
        setInterval(fetchCSVData, 30000);
    </script>
</body>
</html>
